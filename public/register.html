<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sanz SecureFace AI — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root {
    --neon-cyan:#00f5ff;--neon-blue:#0080ff;--neon-green:#00ff88;
    --dark-bg:#020812;--panel-bg:rgba(0,20,50,0.88);
    --border:rgba(0,245,255,0.2);--text-primary:#e0f7ff;
    --text-muted:rgba(150,200,230,0.6);--danger:#ff2d55;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Rajdhani',sans-serif;background:var(--dark-bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.025) 1px,transparent 1px);background-size:50px 50px;}
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.08;}
  .orb-1{width:400px;height:400px;background:var(--neon-blue);top:-100px;left:-100px;}
  .orb-2{width:300px;height:300px;background:var(--neon-cyan);bottom:-50px;right:-50px;}

  .wrapper{position:relative;z-index:10;width:100%;max-width:560px;}

  .brand{text-align:center;margin-bottom:28px;}
  .brand-name{font-family:'Orbitron',monospace;font-size:20px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .brand-sub{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:3px;margin-top:4px;}

  .panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;padding:32px;backdrop-filter:blur(20px);box-shadow:0 0 40px rgba(0,245,255,0.07);}
  .panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent);}
  .panel-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--text-primary);margin-bottom:6px;}
  .panel-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .form-group.full{grid-column:1/-1;}
  .form-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .form-input{background:rgba(0,245,255,0.04);border:1px solid rgba(0,245,255,0.15);border-radius:8px;padding:12px 14px;color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;transition:all 0.2s;width:100%;}
  .form-input:focus{border-color:var(--neon-cyan);background:rgba(0,245,255,0.08);}
  .form-input::placeholder{color:rgba(150,200,230,0.25);}
  select.form-input option{background:#041020;}

  .btn{width:100%;background:linear-gradient(135deg,rgba(0,245,255,0.15),rgba(0,128,255,0.1));border:1px solid var(--neon-cyan);border-radius:8px;color:var(--neon-cyan);font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:3px;padding:15px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;margin-top:20px;position:relative;overflow:hidden;}
  .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue));opacity:0;transition:opacity 0.3s;}
  .btn:hover{box-shadow:0 0 30px rgba(0,245,255,0.35);transform:translateY(-1px);color:#000;}
  .btn:hover::before{opacity:1;}
  .btn span{position:relative;z-index:1;}

  .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
  .alert.show{display:block;}
  .alert-error{background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.3);color:var(--danger);}
  .alert-success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:var(--neon-green);}

  .back-link{text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);}
  .back-link a{color:var(--neon-cyan);text-decoration:none;}
  .back-link a:hover{text-decoration:underline;}
  ::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-thumb{
background:#00d4ff;
border-radius:10px;
}
/* ===== MOBILE RESPONSIVE ===== */

html,
body{
width:100%;
overflow-x:hidden;
scroll-behavior:smooth;
}

/* LOGIN + REGISTER */

.login-wrapper,
.register-wrapper{
padding:20px;
min-height:100vh;
overflow-y:auto;
}

.login-panel,
.register-panel{
width:100%;
max-width:420px;
margin:auto;
}


/* TABLE RESPONSIVE */

table{
width:100%;
overflow-x:auto;
display:block;
}

/* IMAGE RESPONSIVE */

img{
max-width:100%;
height:auto;
}
@media(max-width:768px){

body{
overflow-x:hidden;
}

.form-grid{
grid-template-columns:1fr;
}

.login-panel,
.register-panel{
padding:20px;
border-radius:20px;
}

button{
width:100%;
}

input,
select{
width:100%;
}

.nav-links{
flex-direction:column;
gap:10px;
}

}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-name">SecureFace AI</div>
    <div class="brand-sub">// User Registration Portal</div>
  </div>

  <div class="panel" style="position:relative;">
    <div class="panel-title">Create Account</div>
    <div class="panel-sub">Register a new user in the Sanz AI system</div>

    <div class="alert alert-error" id="errMsg"></div>
    <div class="alert alert-success" id="succMsg"></div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" id="name" placeholder="Full Name" />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="email" type="email" placeholder="email@sanz.ai" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-input" id="role" onchange="onRoleChange()">
          <option value="student">Student</option>
          <option value="mentor">Mentor</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Department</label>
        <input class="form-input" id="department" placeholder="Computer Science" />
      </div>
      <div class="form-group" id="rollNoRow">
        <label class="form-label">Roll Number</label>
        <input class="form-input" id="rollNo" placeholder="CS2024001" />
      </div>
    </div>

    <div class="form-group">
  <label>Profile Photo</label>

  <input 
    type="file" 
    id="photo" 
    accept="image/*"
    class="form-input"
  />
</div>

    <button class="btn" onclick="register()"><span>⟶ Register Account</span></button>
  </div>

  <div class="back-link">Already have an account? <a href="/login">Login here</a></div>
</div>

<script>
function onRoleChange() {
  document.getElementById('rollNoRow').style.display = document.getElementById('role').value === 'student' ? 'flex' : 'none';
}

async function register() {
  const err = document.getElementById('errMsg');
  const succ = document.getElementById('succMsg');
  [err, succ].forEach(e => e.classList.remove('show'));

const formData = new FormData();

formData.append(
  'name',
  document.getElementById('name').value.trim()
);

formData.append(
  'email',
  document.getElementById('email').value.trim()
);

formData.append(
  'password',
  document.getElementById('password').value
);

formData.append(
  'role',
  document.getElementById('role').value
);

formData.append(
  'department',
  document.getElementById('department').value.trim()
);

formData.append(
  'rollNo',
  document.getElementById('rollNo').value.trim()
);

const photo = document.getElementById('photo').files[0];

if(photo){
  formData.append('photo', photo);
}

  try {
    const res = await fetch('/api/users', {
      method: 'POST',
body: formData
    });
    const data = await res.json();
    if (data.success) {
      succ.textContent = 'Account created! Redirecting to login...';
      succ.classList.add('show');
      setTimeout(() => window.location.href = '/login', 1800);
    } else {
      err.textContent = data.message || 'Registration failed.';
      err.classList.add('show');
    }
  } catch(e) {
    err.textContent = 'Server error. Please try again.';
    err.classList.add('show');
  }
}
</script>
</body>
</html>
